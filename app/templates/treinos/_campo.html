<div class="mb-3 field-control{% if field.errors %} field-error{% endif %}">
    <label for="{{ field.id_for_label }}" class="form-label">
        {{ field.label }}{% if not field.field.required and field.name != 'nome' %} <span class="text-secondary fw-normal">(opcional)</span>{% endif %}
    </label>

    {{ field }}

    {% if field.help_text %}
        <div class="form-text">{{ field.help_text|safe }}</div>
    {% endif %}

    {% for error in field.errors %}
        <div class="text-danger small mt-1" role="alert">{{ error }}</div>
    {% endfor %}
</div>
